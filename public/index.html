<!doctype html>
<html lang="en" class="phone">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Robo Rally</title>
  <link rel="icon" type="image/svg+xml" href="img/robo-rally.svg">
  <link rel="preload" href="fonts/roboto-var.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/phone.css">
  <script type="module" src="js/play.js"></script>
</head>
<body>
  <section id="connecting" class="screen center-screen">
    <div class="spinner"></div>
    <p id="connecting-msg" class="quiet"></p>
    <a id="change-room" class="quiet-link" href="./" hidden>Different room</a>
    <a id="check-link" class="quiet-link" href="check.html" hidden>Check this network</a>
  </section>

  <section id="code" class="screen center-screen" hidden>
    <div class="wordmark">Robo Rally</div>
    <!-- the big screen's address, with the room code's four letters left open: they're the end of the address there -->
    <form id="code-form" class="code-entry" autocomplete="off">
      <div id="code-site" class="code-site"></div>
      <div class="entry">
        <span id="code-path" class="code-path"></span>
        <input id="room-code" name="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" class="code-input" placeholder="····" aria-label="Room code">
        <button class="round-go" aria-label="Join"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 20 H28 M21 13 L28 20 L21 27" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </form>
    <a class="quiet-link not-phone" href="host.html">Big screen</a>
  </section>

  <section id="join" class="screen center-screen" hidden>
    <div class="wordmark">Robo Rally</div>
    <div id="join-robot" class="join-robot"></div>
    <form id="join-form" class="entry" autocomplete="off">
      <input id="name" name="name" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="Your name" aria-label="Your name">
      <button id="join-btn" class="round-go" aria-label="Join"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 20 H28 M21 13 L28 20 L21 27" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
    <p id="join-error" class="form-error" hidden></p>
    <a id="host-link" class="quiet-link not-phone" href="host.html" hidden>Big screen</a>
  </section>

  <section id="wait" class="screen wait-screen" hidden>
    <button id="ask-btn" class="ask-btn" aria-label="Help" hidden></button>
    <button id="me-robot" class="me-robot" aria-label="Change your robot"></button>
    <div id="me-forms" class="me-forms"></div>
    <div id="wait-name" class="me-name"></div>
    <div id="wait-watch" class="wait-watch" hidden></div>
    <div class="wait-bottom">
      <button id="vip-start" class="start-pill" hidden aria-label="Start the race"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M15 11 L29 20 L15 29 Z" fill="currentColor"/></svg></button>
      <!-- everyone else: whose robot starts the race (that player's phone has the start) -->
      <div id="vip-wait" class="vip-wait" hidden></div>
    </div>
  </section>

  <section id="game" class="screen game-screen" hidden>
    <main id="stage" class="stage"></main>
    <button id="menu-btn" class="menu-dot" aria-label="Game menu" hidden><i></i><i></i><i></i></button>
    <div id="menu" class="sheet-menu" hidden>
      <button class="btn block" data-lobby="restart">Start over</button>
      <button class="btn block" data-lobby="end">Back to lobby</button>
      <button class="btn block ghost">Cancel</button>
    </div>
  </section>

  <section id="notice" class="screen center-screen" hidden>
    <h1 id="notice-title"></h1>
    <p id="notice-msg" class="quiet"></p>
    <button id="notice-btn" class="btn primary"></button>
  </section>

  <div id="offline" class="offline" hidden>Reconnecting…</div>
</body>
</html>
