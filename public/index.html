<!doctype html>
<html lang="en" class="phone" data-theme="factory">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10181d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Robo Rally</title>
  <link rel="icon" type="image/svg+xml" href="img/robo-rally.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/phone.css">
  <link rel="stylesheet" href="games/robo-rally/lobby.css">
  <script type="module" src="js/play.js"></script>
</head>
<body>
  <section id="connecting" class="screen center-screen">
    <div class="spinner"></div>
    <p id="connecting-msg" class="muted">Connecting…</p>
    <a id="change-room" class="host-link" href="./" hidden>Use a different room code</a>
    <a id="check-link" class="host-link" href="check.html" hidden>Can't connect? Check this network</a>
  </section>

  <section id="code" class="screen center-screen" hidden>
    <div class="factory-wordmark" aria-label="Robo Rally">ROBO<span>RALLY</span></div>
    <form id="code-form" class="join-form" autocomplete="off">
      <input id="room-code" name="code" maxlength="4" placeholder="····" aria-label="Room code from the big screen" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" class="code-input">
      <button class="btn btn-xl block join-go" aria-label="Join">▶</button>
    </form>
    <nav class="host-links">
      <a class="host-link" href="host.html">📺 Big screen</a>
      <a class="host-link" href="check.html">📶 Network check</a>
    </nav>
  </section>

  <section id="join" class="screen center-screen" hidden>
    <div class="factory-wordmark" aria-label="Robo Rally">ROBO<span>RALLY</span></div>
    <form id="join-form" class="join-form" autocomplete="off">
      <input id="name" name="name" maxlength="16" placeholder="Your name" aria-label="Your name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
      <button id="join-btn" class="btn btn-xl block join-go" aria-label="Join">▶</button>
      <p id="join-error" class="form-error" hidden></p>
    </form>
    <nav class="host-links"><a id="host-link" class="host-link" href="host.html" hidden>📺 Big screen</a></nav>
  </section>

  <!-- The waiting room: your robot (tap it to choose another), the lessons, and for the leader the start
       button at the very bottom, live as soon as the race can start. Who else is in shows on the big screen. -->
  <section id="wait" class="screen" hidden>
    <div class="me-card">
      <button id="robot-pick" class="me-dot" aria-label="Choose your robot"></button>
      <span id="wait-name" class="me-name"></span>
      <button id="robot-change" class="robot-change" aria-label="Choose your robot" title="Choose your robot">⇄</button>
    </div>
    <div id="wait-busy" class="look-up" hidden aria-label="A race is on: watch the big screen"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 21 L20 9 L32 21 M8 33 L20 21 L32 33" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span aria-hidden="true">📺</span></div>
    <div class="factory-lessons" data-lessons></div>
    <button id="vip-start" class="btn btn-xl block wait-start" aria-label="Start the race" hidden>▶</button>
  </section>

  <section id="game" class="screen game-screen" hidden>
    <header class="phone-bar">
      <span class="me-dot"></span>
      <span id="bar-name" class="bar-name"></span>
      <span class="spacer"></span>
      <button id="menu-btn" class="bar-btn" aria-label="Game menu" hidden>•••</button>
    </header>
    <main id="stage" class="stage"></main>
    <div id="menu" class="sheet" hidden>
      <button class="btn block" data-lobby="restart" aria-label="Restart the race">↺</button>
      <button class="btn block secondary" data-lobby="end" aria-label="Back to the lobby">🏠</button>
      <button class="btn block ghost" aria-label="Close">✖</button>
    </div>
  </section>

  <section id="notice" class="screen center-screen" hidden>
    <h1 id="notice-title"></h1>
    <p id="notice-msg" class="muted"></p>
    <button id="notice-btn" class="btn btn-xl"></button>
  </section>

  <dialog id="avatar-dialog" class="avatar-dialog">
    <button id="avatar-close" class="avatar-close" aria-label="Done choosing robot">✓</button>
    <div id="avatar-picker"></div>
  </dialog>
  <div id="offline" class="offline" hidden>Reconnecting…</div>
</body>
</html>
