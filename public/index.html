<!doctype html>
<html lang="en" class="phone" data-theme="factory">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10181d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Robo Rally</title>
  <link rel="icon" type="image/svg+xml" href="img/robo-rally.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/phone.css">
  <link rel="stylesheet" href="games/robo-rally/lobby.css">
  <script type="module" src="js/play.js"></script>
</head>
<body>
  <section id="connecting" class="screen center-screen">
    <div class="spinner"></div>
    <p id="connecting-msg" class="muted">Connecting…</p>
    <a id="change-room" class="host-link" href="./" hidden>Use a different room code</a>
    <a id="check-link" class="host-link" href="check.html" hidden>Can't connect? Check this network</a>
  </section>

  <section id="code" class="screen center-screen" hidden>
    <div class="factory-wordmark" aria-label="Robo Rally">ROBO<span>RALLY</span></div>
    <p class="factory-tagline">Factory closed. Race on.</p>
    <form id="code-form" class="join-form" autocomplete="off">
      <label for="room-code">Room Code</label>
      <input id="room-code" name="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" class="code-input">
      <button class="btn btn-xl block">Join the race →</button>
      <p class="muted small">From the big screen.</p>
    </form>
    <a class="host-link" href="host.html">Open the big screen →</a>
    <a class="host-link" href="check.html">Check this network</a>
  </section>

  <section id="join" class="screen center-screen" hidden>
    <div class="factory-wordmark" aria-label="Robo Rally">ROBO<span>RALLY</span></div>
    <p class="factory-tagline">Factory closed. Race on.</p>
    <form id="join-form" class="join-form" autocomplete="off">
      <label for="name">Your name</label>
      <input id="name" name="name" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="go">
      <button id="join-btn" class="btn btn-xl block">Power up →</button>
      <p id="join-error" class="form-error" hidden></p>
    </form>
    <a id="host-link" class="host-link" href="host.html" hidden>Open the big screen →</a>
  </section>

  <section id="wait" class="screen" hidden>
    <div class="me-card">
      <span class="me-dot"></span>
      <span id="wait-name" class="me-name"></span>
      <button id="robot-change" class="robot-change" aria-label="Choose your robot" title="Choose your robot">⇄</button>
    </div>
    <h1 id="wait-title" class="bar-title"></h1>
    <p id="wait-msg" class="muted"></p>
    <div id="vip" class="panel vip" hidden>

      <button id="vip-start" class="btn btn-xl block">Let's race →</button>
      <p id="vip-problem" class="muted small"></p>
    </div>
    <div class="factory-lessons" data-lessons></div>
    <div class="panel">
      <h2>Starting line</h2>
      <div id="wait-players" class="player-chips"></div>
    </div>
  </section>

  <section id="game" class="screen game-screen" hidden>
    <header class="phone-bar">
      <span class="me-dot"></span>
      <span id="bar-name" class="bar-name"></span>
      <span class="spacer"></span>
      <button id="menu-btn" class="bar-btn" aria-label="Game menu" hidden>•••</button>
    </header>
    <main id="stage" class="stage"></main>
    <div id="menu" class="sheet" hidden>
      <button class="btn block" data-lobby="restart">Restart Game</button>
      <button class="btn block secondary" data-lobby="end">End Game</button>
      <button class="btn block ghost">Cancel</button>
    </div>
  </section>

  <section id="notice" class="screen center-screen" hidden>
    <h1 id="notice-title"></h1>
    <p id="notice-msg" class="muted"></p>
    <button id="notice-btn" class="btn btn-xl"></button>
  </section>

  <dialog id="avatar-dialog" class="avatar-dialog">
    <button id="avatar-close" class="avatar-close" aria-label="Done choosing robot">✓</button>
    <div id="avatar-picker"></div>
  </dialog>
  <div id="offline" class="offline" hidden>Reconnecting…</div>
</body>
</html>
