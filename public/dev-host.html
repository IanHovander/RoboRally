<!doctype html>
<html lang="en" class="host">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen big screen dev</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/host.css">
<link rel="stylesheet" href="games/robo-rally/lobby.css">
<link rel="stylesheet" href="games/robo-rally/style.css">
</head>
<body>
<section class="screen game-screen" id="game"><main id="stage" class="stage"></main></section>
<script type="module">
// The big screen without a server or phones: the real rules run right here, so every phase can be looked at
// (at any window size: a TV, or a phone held either way).
//   dev-host.html?to=setup | start | brief | practice | program | race | over      &n=4  &course=closing-time
//   (start: the draw for start pads; dev.fire('deadline') ends it)
//   (practice: the Briefing's second stage, the phones' test drive; dev.act(1, 'practice', { level: 2 }) moves a robot on)
//   (over: a staged first slot ends the race, so the ending has standings, awards and a moment to play again;
//    lumenHost.holdEnding('awards', 2) holds it at a stage (winner, places, awards, replay, rest),
//    lumenHost.skipEnding() jumps to its end, dev.act(0, 'rematch') races again)
import rules from './games/robo-rally/rules.js';
import mountHost from './games/robo-rally/host.js';
import { wireActions } from './js/ui.js';
const q = new URLSearchParams(location.search);
const colors = ['#51cf66', '#ff4d6d', '#4dabf7', '#ffd43b', '#cc5de8', '#ff922b', '#22d3ee', '#f783ac'];
const n = Number(q.get('n') ?? 4);
const players = Array.from({ length: n }, (_, i) => ({ id: 'p' + i, name: ['Ivy', 'Ada', 'Bolt', 'Cog', 'Dex', 'Echo', 'Fuse', 'Gizmo'][i], color: colors[i], avatar: i, connected: true, isVip: i === 0 }));
const timers = new Map();
const ctx = {
  state: null, players,
  player: (id) => players.find((p) => p.id === id) ?? null,
  timer: (name, ms, fn) => timers.set(name, fn),
  cancelTimer: (name) => timers.delete(name),
  after: () => () => {},
  end: () => {},
};
rules.setup(ctx);
const s = () => ctx.state;
const act = (who, type, payload) => rules.actions[type](ctx, players[who], payload);
const api = {
  role: 'host', players,
  send: async (type, payload) => { const r = rules.hostActions?.[type]?.(ctx, payload) ?? rules.actions[type]?.(ctx, players[0], payload); setTimeout(redraw, 0); return r; },
  now: () => Date.now(), secondsLeft: (d) => Math.max(0, Math.ceil((d - Date.now()) / 1000)), vibrate() {},
};
const root = document.createElement('div');
root.className = 'game-root';
document.getElementById('stage').append(root);
wireActions(document.getElementById('stage'), (t, p) => api.send(t, p));
const screen = mountHost(root, api);
function redraw() { screen.update(JSON.parse(JSON.stringify(rules.hostView(ctx)))); }
window.dev = { ctx, act, redraw, rules, fire: (name) => { const r = fire(name); redraw(); return r; } };

const to = q.get('to') ?? 'setup';
rules.actions.setOpt(ctx, players[0], { key: 'course', value: q.get('course') ?? 'closing-time' });
rules.actions.setOpt(ctx, players[0], { key: 'timer', value: 120 });
const fire = (name) => { const fn = timers.get(name); timers.delete(name); fn?.(ctx); return !!fn; };
const beat = () => fire('beat');
/** ?to=over: slot 1, staged. Ada shoves Bolt into a pit and shoots Cog; Ivy takes the last flag. */
function stageEnding() {
  const spots = [{ x: 10, y: 3, d: 1, cp: 1 }, { x: 4, y: 4, d: 0 }, { x: 4, y: 3, d: 0 }, { x: 4, y: 1, d: 1 }];
  const first = ['m1', 'm1', 'rr', 'rl'];
  s().prio = 0;
  for (let i = 0; i < n; i++) {
    const R = s().robots[players[i].id];
    Object.assign(R, spots[i] ?? {});
    const is = (c) => c.startsWith(`${first[i] ?? 'rr'}.`);
    const pile = [R.hand, R.deck, R.discard].find((p) => p.some(is));
    R.hand.unshift(pile.splice(pile.findIndex(is), 1)[0]);
    act(i, 'lock', { regs: R.hand.slice(0, 5).map((c) => [c]) });
  }
  while (s().phase === 'activate' && beat());
  beat(); // (the race is over: its last beat's timer starts the ending's)
}
if (to !== 'brief' && to !== 'practice') players.forEach((p, i) => act(i, 'hello', { raced: true }));
if (to !== 'setup') {
  s().rng = 7; // (the same draw for start pads every time, so a screen looks the same twice)
  act(0, 'begin');
  if (to !== 'start') {
    fire('deadline'); // the draw is over
    if (to === 'practice') rules.hostActions.briefDone(ctx); // the film is over
    if (to === 'race') {
      for (let i = 0; i < n; i++) { const R = s().robots[players[i].id]; act(i, 'lock', { regs: R.hand.slice(0, 5).map((c) => [c]) }); }
      for (let k = 0; k < Number(q.get('beats') ?? 6) && s().phase === 'activate' && beat(); k++);
    }
    if (to === 'over') stageEnding();
  }
}
redraw();
window.ready = true;
</script>
</body>
</html>
