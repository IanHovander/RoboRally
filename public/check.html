<!doctype html>
<html lang="en" class="phone" data-theme="arena">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9a0000">
  <title>Game Night · Network check</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/phone.css">
  <style>
    .screen > .logo { align-self: center; margin-top: 0.4rem; }
    .intro { text-align: center; }
    /* white = it works, black with a red stripe = it doesn't */
    .checks { display: flex; flex-direction: column; gap: 0.7rem; }
    .check {
      display: grid; grid-template-columns: 2rem 1fr; gap: 0.2rem 0.6rem; align-items: center;
      padding: 0.8rem 1rem; border: 0.2rem solid var(--black); border-radius: 0.9rem;
      background: var(--white); color: var(--black); box-shadow: 0.25rem 0.3rem 0 var(--black);
    }
    .check .mark { grid-row: span 2; font-size: 1.5rem; text-align: center; }
    .check b { font-size: 1.05rem; }
    .check .muted { color: #555; }
    .check span.muted { font-size: 0.9rem; }
    .check.bad { background: var(--black); color: var(--white); box-shadow: inset 0.5rem 0 0 var(--red-hi), 0.25rem 0.3rem 0 var(--black); }
    .check.bad .muted { color: var(--grey); }
    .verdict { padding: 1rem 1.1rem; border: 0.2rem solid var(--black); border-radius: 0.9rem; font-weight: 700; font-size: 1.15rem; background: var(--white); color: var(--black); }
    .verdict.bad { background: var(--black); color: var(--white); box-shadow: inset 0.5rem 0 0 var(--red-hi); }
  </style>
</head>
<body>
  <section class="screen">
    <div class="logo">Network <span>check</span></div>
    <p class="muted intro">Can this phone play from here?</p>
    <p id="who" class="muted small"></p>
    <div id="checks" class="checks"></div>
    <div id="verdict" class="verdict">Checking…</div>
    <button id="again" class="btn block secondary" hidden>Check again</button>
    <a class="host-link" href="./">Back to the game</a>
  </section>
  <script type="module" src="js/tools/check.js"></script>
</body>
</html>
