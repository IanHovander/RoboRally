<!doctype html>
<html lang="en" class="phone">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080b">
  <title>Robo Rally · Network check</title>
  <link rel="icon" type="image/svg+xml" href="img/robo-rally.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/phone.css">
  <style>
    html.phone body { overflow: auto; }
    .phone .screen.check-screen { position: static; display: flex; flex-direction: column; gap: 1rem; max-width: 30rem; margin: 0 auto; padding: 2rem 1.1rem; }
    .check-screen .wordmark { align-self: center; font-size: 1rem; margin: 0.4rem 0 0.6rem; }
    .intro { text-align: center; }
    /* lit = it works, dark with a coral edge = it doesn't */
    .checks { display: flex; flex-direction: column; gap: 0.7rem; }
    .check {
      display: grid; grid-template-columns: 2rem 1fr; gap: 0.2rem 0.6rem; align-items: center;
      padding: 0.8rem 1rem; border-radius: 1rem; border: 1px solid var(--hair2);
      background: rgba(244, 239, 228, 0.92); color: var(--ink);
    }
    .check .mark { grid-row: span 2; font-size: 1.4rem; text-align: center; }
    .check b { font-size: 1.05rem; font-weight: 500; }
    .check .muted { color: #555; }
    .check span.muted { font-size: 0.9rem; }
    .check.bad { background: rgba(16, 20, 27, 0.9); color: var(--light); box-shadow: inset 0.35rem 0 0 var(--coral); }
    .check.bad .muted { color: var(--dim); }
    .verdict { padding: 1rem 1.1rem; border-radius: 1rem; font-weight: 500; font-size: 1.1rem; background: var(--light); color: var(--ink); }
    .verdict.bad { background: rgba(16, 20, 27, 0.9); color: var(--light); box-shadow: inset 0.35rem 0 0 var(--coral); }
    .host-link { color: var(--faint); text-align: center; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.85rem; text-decoration: none; }
  </style>
</head>
<body>
  <section class="screen check-screen">
    <div class="wordmark">Network check</div>
    <p class="muted intro">Can this phone play from here?</p>
    <p id="who" class="muted small"></p>
    <div id="checks" class="checks"></div>
    <div id="verdict" class="verdict">Checking…</div>
    <button id="again" class="btn block secondary" hidden>Check again</button>
    <a class="host-link" href="./">Back to the game</a>
  </section>
  <script type="module" src="js/tools/check.js"></script>
</body>
</html>
