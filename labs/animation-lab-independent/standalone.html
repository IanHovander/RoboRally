<script>
/* Independent animation direction A: practical miniature stage mechanisms. */
(() => {
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const range = (t,a,b) => clamp((t-a)/(b-a));
  const ease = (v) => {v=clamp(v); return v*v*(3-2*v);};
  const mix = (a,b,t) => a+(b-a)*t;
  const pulse = (t,a,b) => Math.sin(Math.PI*range(t,a,b));
  const treatments = {
    move:['Ratchet receipt winch','Telescoping chassis catch-up','Hinged price tiles','Cardboard loading ramp','Stubborn caster straightens'],
    turn:['Head knocks on body','Tape-gun anchor pivot','Threaded lifting screw','Folding aisle arrow','Pinned foot sweeps an arc'],
    push:['Handle escort','Pleated body extension','Static cheek peel','Queue lean and frantic feet','Displacement till receipt'],
    chain:['Nested cart frames','Backward eye-roll relay','Shared running undercarriage','Delayed spring squash','Tearing queue-ticket strip'],
    blocked:['Receipt-return wall slot','Chassis piles over feet','Chalk door peels away','Polite telescoping finger','Antenna pressure release'],
    edge:['Hinged flooring sample','Barcode strips descend','Stockroom strip curtain','Clipboard permission to fall','Caster circles after chassis'],
    pit:['Gusseted bagging trap','Spiral drain and last antenna','Descending elevator cabinet','Useless measured rescue','Origami parcel fold'],
    reboot:['Flat-pack screw assembly','Returns-hatch delivery','Printer extrusion','Maintenance wringer','Inventory outline and parts'],
    fire:['Folding barcode scanner','Rewinding luminous tape','Lamp cone squeezed into muzzle','Laser filament spool','Swelling muzzle and shutter dab'],
    hit:['Internal hardware shelves','Migrating sprung dent','Late face-loading dial','Impact thermal receipt','Double-clapping hinged panel'],
    belt:['Reverse-running treadmill','Folding luggage handle','Cable reel and tidy bow','Checkout-divider escort','Walking conveyor slats'],
    panel:['Parcel drawer ejector','Bell and padded finger','Shelf-sweeper arm','Accordion-wall bellows','Inflating test cushion'],
    gear:['Jar-grip release pop','Display platter and price tag','Gear-combed cables','Delayed wind-up key','Record platter and stylus'],
    energy:['Vending tongue pickup','Cable-spaghetti intake','Rolling power label','One-unit helper crank','Nested battery shells'],
    checkpoint:['Timecard hole punch','Tangling velvet rope','Shadow-only stock stamp','Receipt-fold crown badge','Bowing security gates'],
    damage:['Return-loop junk mail','Filing-drawer replacement','Card-driven marionette','Accordion coupon refold','Arguing printer rollers'],
    shield:['Warranty-book umbrella','Local envelope shredder','Inward packing-bubble pop','Dropping service shutter','Laser-lint roller sheet'],
    upgrade:['Self-selecting mounting tool','EMP closing-sign wave','Fitting-room swap','Tractor base tape','Displacement drawer slide'],
    shutdown:['Settling showroom cover','Cash-drawer eye shutters','Folded resting chair','Rolling maintenance sleeve','Appendages stop in sequence'],
    win:['Expanding portrait frame','Receipt snaps to winner','Flat cartons form plinth','Retail fittings take a bow','Tiny snip opens banner']
  };
  function draw(ctx,scenarioId,ideaIndex,t,palette) {
    const p=palette, i=ideaIndex, T=Math.min(.85,clamp(t));
    const q=ease(range(T,.24,.70)), a=range(T,.06,.24), k=range(T,.24,.70);
    ctx.save(); ctx.clearRect(0,0,400,240); ctx.fillStyle=p.bg; ctx.fillRect(0,0,400,240);
    ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
    const line=(x,y,x2,y2,c=p.fg,w=2)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();};
    const box=(x,y,w,h,c=p.robot,stroke=p.fg)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);}};
    const circle=(x,y,r,c=p.robot,stroke=p.fg)=>{ctx.beginPath();ctx.arc(x,y,Math.max(.01,r),0,Math.PI*2);ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}};

    const floor=(hole=-1)=>{for(let n=0;n<5;n++){const x=45+n*62;ctx.save();ctx.globalAlpha=.2;box(x,176,62,23,p.muted,null);ctx.restore();line(x,176,x,199,p.line,1);line(x,176,x+62,176,p.line,1);if(n===hole)box(x+1,176,60,23,p.bg,null);}line(45,199,355,199,p.line,1);line(45,201,355,201,p.fg,.5);};
    const bot=(x,y=177,{rot=0,sx=1,sy=1,color=p.robot,eye=0,alpha=1,face=1,heading=0}={})=>{ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,sy);ctx.beginPath();ctx.ellipse(0,-2,25,6,0,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=1;ctx.shadowColor=color;ctx.shadowBlur=7;ctx.stroke();ctx.shadowBlur=0;const g=ctx.createLinearGradient(-20,-54,20,-8);g.addColorStop(0,p.fg);g.addColorStop(.12,color);g.addColorStop(.68,p.bg);g.addColorStop(1,color);ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-19,-54,38,44,14);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.ellipse(-6,-43,6,3,-.4,0,Math.PI*2);ctx.fillStyle=p.fg;ctx.globalAlpha=alpha*.3;ctx.fill();ctx.globalAlpha=alpha;ctx.shadowColor=p.fg;ctx.shadowBlur=10;circle(8*face+eye,-33,3.4,p.fg,null);ctx.shadowBlur=0;ctx.save();ctx.translate(0,-2);ctx.rotate(heading);poly([[27*face,-3],[34*face,0],[27*face,3]],p.fg,null);ctx.restore();ctx.restore();};
    const receipt=(x,y,len=50,rot=0)=>{ctx.save();ctx.translate(x,y);ctx.rotate(rot);box(-12,0,24,len,p.bg);for(let n=8;n<len-3;n+=7)line(-7,n,7,n,p.muted,1);poly([[-12,len],[-6,len-3],[0,len],[6,len-3],[12,len]],p.bg);ctx.restore();};
    const spring=(x1,y1,x2,y2,coils=7)=>{ctx.beginPath();ctx.moveTo(x1,y1);for(let n=1;n<coils*2;n++){let v=n/(coils*2);ctx.lineTo(mix(x1,x2,v)+(n%2?4:-4),mix(y1,y2,v));}ctx.lineTo(x2,y2);ctx.strokeStyle=p.fg;ctx.lineWidth=2;ctx.stroke();};

    const card=(x,y,label,rot=0,c=p.bg)=>{ctx.save();ctx.translate(x,y);ctx.rotate(rot);box(-15,-21,30,42,c);text(label,0,5,p.fg,12);ctx.restore();};
    const beam=(x1,y1,x2,y2)=>{line(x1,y1,x2,y2,p.danger,5);line(x1,y1,x2,y2,p.bg,1);};
    const piston=(x,y,extension)=>{box(x-12,y-25,24,25,p.muted);box(x-5,y,10,extension,p.fg);box(x-30,y+extension,60,10,p.accent);};
    const puff=(x,y,r)=>{for(let n=0;n<5;n++)circle(x+Math.cos(n*1.25)*r*.5,y+Math.sin(n*1.25)*r*.5,r*.45,p.bg,p.line);};
    floor();
    switch(scenarioId) {
      case 'move': {
        const x=mix(107,231,q), wob=pulse(T,.24,.70);

        if(i===2){for(let n=0;n<3;n++){const z=range(T,.16+n*.15,.36+n*.15);ctx.save();ctx.translate(107+n*62,179);ctx.scale(1,Math.cos(z*Math.PI));box(-28,-48,56,48,p.muted);if(z>0&&z<1)bot(0,0,{alpha:.5});ctx.restore();}bot(x,177,{alpha:T<.7?.55:1});}
        if(i===3){const z=ease(range(T,.02,.22));ctx.save();ctx.translate(77,181);ctx.rotate(-.6*(1-z));box(-30,-10,60,10,p.accent);ctx.restore();card(64,116,'→',-.35*(1-z));bot(x,177-18*(1-q));}
        if(i===4){bot(x,177,{rot:-.06*wob});for(let n=0;n<4;n++){ctx.save();ctx.translate(x-18+n*12,178);ctx.rotate(n===3?Math.PI/2*(1-ease(range(T,.12,.3))):0);box(-5,-3,10,6,p.muted);ctx.restore();}if(T<.3)arc(x+19,176,13,-Math.PI/2,Math.PI/2,p.accent);}
        break;
      }
      case 'turn': {
        const h=q*Math.PI/2;
        if(i===0){bot(200,177,{heading:h});ctx.save();ctx.translate(200,132);ctx.scale(Math.max(.2,Math.abs(Math.cos(Math.PI*range(T,.04,.22)))),1);box(-16,-8,32,15,p.bg);circle(5,0,2,p.fg);ctx.restore();if(T>.16&&T<.35)line(225,133,218,146,p.accent,4);}
        if(i===1){circle(200,181,6,p.accent);const x=200+65*Math.cos(h),y=163+24*Math.sin(h);box(x-7,y-12,14,24,p.accent);line(200,150,x,y,p.muted,4);bot(200,177,{heading:h,sx:1-.22*pulse(T,.24,.7)});}
        if(i===2){const lift=25*pulse(T,.12,.7);spring(200,177,200,177-lift);bot(200,177-lift,{heading:h});for(let n=0;n<3;n++)arc(200,181-lift*.3+n*5,13,0,Math.PI,p.line);}
        if(i===3){const z=ease(range(T,.02,.20));ctx.save();ctx.translate(200,mix(64,119,ease(range(T,.68,.82))));ctx.rotate(z*Math.PI/2);poly([[-24,-8],[10,-8],[10,-16],[28,0],[10,16],[10,8],[-24,8]],p.accent);ctx.restore();bot(200,177,{heading:h,eye:T<.24?-2:0});}
        if(i===4){arc(200,178,37,0,h,p.accent,3);circle(200,178,5,p.fg);circle(200+37*Math.cos(h),178+10*Math.sin(h),7,p.muted);bot(200,177,{heading:h+.16*Math.sin(range(T,.7,.85)*Math.PI*2)*(1-range(T,.7,.85))});}
        break;
      }
      case 'push': {
        const x=107+62*q,y=169+62*q,w=pulse(T,.22,.7);
        if(i===0){line(y-22,139,y-40,139,p.fg,3);line(y-40,139,y-40,151,p.fg,3);bot(y,177,{color:p.other});bot(x,177,{rot:.12*w});if(T>.7)line(y-22,139,y-22,150);}
        if(i===1){bot(x);bot(y,177,{color:p.other,sx:1-.35*w,sy:1+.1*w});for(let n=0;n<5;n++)line(y-15+n*7,140,y-20+n*7,163,p.line);}
        if(i===2){if(T>.2&&T<.7){for(let n=0;n<5;n++)line(x+22,136+n*6,y-22,136+n*6,p.accent,1+2*w);}bot(x,177,{rot:.14*w});bot(y,177,{color:p.other,rot:-.14*w});}
        if(i===3){bot(x,177,{rot:.18*w});bot(y,177,{color:p.other,eye:-3,rot:-.05*w});for(let n=0;n<2;n++){const z=Math.sin(k*36+n*Math.PI)*8*w;line(y-10+n*20,168,y-10+n*20+z,180,p.fg,3);}}
        if(i===4){bot(x);bot(y,177,{color:p.other,eye:-2});if(T>.12&&T<.76){receipt(y-18,144,30* Math.min(1,a));line(y-25,155,y-35,155);text('1',y-18,160,p.fg,10);}}
        break;
      }
      case 'chain': {

        if(i===0){xs.forEach((x,n)=>{cart(x,177);bot(x,170,{sx:1-.25*w,sy:1-.18*w,color:n?p.other:p.robot});});}
        if(i===1){xs.forEach((x,n)=>{bot(x,177,{eye:Math.sin(range(T,.35+(2-n)*.1,.5+(2-n)*.1)*Math.PI)*-4,color:n?p.other:p.robot});if(T>.15+n*.1&&T<.4+n*.1)line(x+24,143,x+37,136,p.accent,3);});}
        if(i===2){xs.forEach((x,n)=>{bot(x,177,{color:n?p.other:p.robot});for(let j=0;j<3;j++){const z=Math.sin(k*32+n+j)*9*w;line(x-18+j*16,165,x-18+j*16+z,179,p.fg,3);}});}
        if(i===3){xs.forEach((x,n)=>{const z=pulse(T,.18+n*.08,.55+n*.08);bot(x,177,{sx:1-.25*z,sy:1+.2*z,color:n?p.other:p.robot});spring(x+22,143,x+39,143);});}
        if(i===4){line(xs[0]-20,118,xs[2]+20,118,p.accent,3);xs.forEach((x,n)=>{bot(x,177,{color:n?p.other:p.robot});card(x,103,String(n+1),0,p.bg);if(T>.7){box(x+27,114,8,8,p.bg,null);}});}

        if(i===0){bot(200);receipt(mix(200,231,pulse(T,.12,.63)),144,25,Math.PI/2);if(T>.4&&T<.74)stamp(210,111,'RETURN');}
        if(i===1){bot(200,177,{sx:1+.4*w,sy:1-.22*w,rot:.15*w});circle(189,171,7,p.muted);circle(211,171,7,p.muted);}
        if(i===2){bot(200,177,{eye:3});const z=range(T,.08,.35);ctx.save();ctx.translate(236,176);ctx.rotate(range(T,.52,.75)*1.3);ctx.globalAlpha=T>.75?0:1;box(-1,-65*z,18,65*z,p.bg);circle(12,-30,2,p.fg);ctx.restore();line(222,139,235,120+25*(1-z),p.accent,3);}
        if(i===3){bot(200,177,{rot:-.1*w});box(234-20*w,120,20*w,10,p.accent);circle(234-20*w,125,5,p.accent);}

        if(i===0){ctx.save();ctx.translate(235,181);ctx.rotate(1.5*ease(range(T,.2,.65)));box(-27,-4,54,8,p.muted);ctx.restore();if(drop<1)bot(x,y,{rot:drop*.7});}

        if(i===3){const d=ease(range(T,.52,.7));if(d<1)bot(x,177+180*d,{eye:2});if(T>.19&&T<.77){const yy=86+150*ease(range(T,.66,.78));box(280,yy,30,40,p.bg);line(260,137,281,yy+30);box(285,yy+10,8,8,p.bg);if(T>.44){line(286,yy+14,289,yy+18,p.accent);line(289,yy+18,297,yy+8,p.accent);}}}

        ctx.save();ctx.beginPath();ctx.rect(0,0,400,180);ctx.clip();
        if(i===0){if(T<.35)bot(200);const z=ease(range(T,.12,.35));box(173,179-64*z+140*d,54,64*z,p.muted);poly([[173,179-64*z+140*d],[183,145+140*d],[200,159+140*d],[218,145+140*d],[227,179-64*z+140*d]],p.muted);arc(200,116+140*d,15,Math.PI,Math.PI*2,p.fg,3);}

ce."},{"id":"push-24","title":"Instant forklift","action":"Pusher grows short fork tines that stay cosmetic beneath the target without lifting it across obstacles."},{"id":"push-25","title":"Rubber duck bumper","action":"A duck-shaped bumper squashes silently and reinflates at the end of contact."},{"id":"push-26","title":"Inventory handover","action":"A clipboard passes from target to pusher during the move, then returns with an arrow drawn on it."},{"id":"push-27","title":"Coat-tail tug","action":"Target's back panel stretches like a coat tail and snaps flush when movement ends."},{"id":"push-28","title":"Tea remains level","action":"Target produces a tiny cup that stays perfectly level through its body wobble."},{"id":"push-29","title":"Reverse moonwalk","action":"Target's feet walk against the push while its base still follows the authoritative path."},{"id":"push-30","title":"Floor polishing","action":"A mop deploys under the target, making the legal slide look suspiciously effortless."},{"id":"push-31","title":"Pusher overcommits","action":"Pusher's arms continue reaching after bodies stop, then slowly retract."},{"id":"push-32","title":"Social distance ruler","action":"A tiny ruler extends between noses, compresses during contact, and folds away after separation."},{"id":"push-33","title":"Side mirror surprise","action":"Target's rearview mirror spots the pusher one beat too late."},{"id":"push-34","title":"Packaging squeak","action":"Target's shell wrinkles like clear packaging at contact and smooths while sliding."},{"id":"push-35","title":"Handle pops wrong side","action":"A target handle appears on its front; pusher reaches around cosmetically while both move legally."},{"id":"push-36","title":"Spring-loaded knees","action":"The target's knees fold backward in shock and recover over the exact displacement."},{"id":"push-37","title":"Velcro shoulders","action":"A visible strip peels between the bodies at the end of the shove."},{"id":"push-38","title":"Label transfer","action":"A PUSH label transfers from pusher to target's back, then falls flat and vanishes."},{"id":"push-39","title":"Personal turnstile","action":"Target's waist turns cosmetically like a turnstile while its heading marker remains unchanged."},{"id":"push-40","title":"Puddle of feet","action":"Target feet flatten into puddle-like pads, slide, and rise back into shoes."},{"id":"push-41","title":"Cardboard shield failure","action":"Target offers a cardboard stop sign that simply folds at contact without preventing the shove."},{"id":"push-42","title":"Pocket handrail","action":"Target grabs a handrail emerging from its own pocket and rides itself to the next tile."},{"id":"push-43","title":"Trolley chain release","action":"A little cart chain links the bodies and releases with a coin-shaped glint at the endpoint."},{"id":"push-44","title":"Belly piston","action":"The pusher's belly piston extends into contact and retracts as the move finishes."},{"id":"push-45","title":"Shoulder seesaw","action":"Target's shoulders tilt in opposite directions, passing a wobble through its body."},{"id":"push-46","title":"Dust line negotiation","action":"Target draws a line at its feet; the line comically travels with it during the shove."},{"id":"push-47","title":"Tiny moving notice","action":"A MOVING label flips out from the target's back during displacement, then closes."},{"id":"push-48","title":"Foot brakes too late","action":"Two heel brakes spark cosmetically only after arrival, then sheepishly lift."},{"id":"push-49","title":"Passenger seat","action":"Target briefly folds into a seated posture while gliding, then stands at its legal endpoint."},{"id":"push-50","title":"Contact handshake","action":"Two small side arms shake hands during the shove and release exactly when movement ends."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"chain","title":"Chain pushes","rule":"The entire legal chain shifts together; a blocked chain stays in place.","selected":["chain-01","chain-02","chain-03","chain-04","chain-05"],"ideas":[{"id":"chain-01","title":"Nested shopping carts","action":"Robots telescope briefly into cart-like nested silhouettes; the compressed line extends one tile farther and each body reappears at its resolved position."},{"id":"chain-02","title":"Complaint travels backward","action":"Each robot taps the next shoulder as the chain moves; the last robot's offended look passes backward faster than the shove."},{"id":"chain-03","title":"Borrowed legs","action":"Each chassis stays upright while legs beneath the whole line run like one many-legged creature, delivering the chain's exact displacement."},{"id":"chain-04","title":"Desk-toy compression","action":"A squash pulse passes through the bodies like an executive desk toy; all bases move on the same rule clock despite the delayed wobble."},{"id":"chain-05","title":"Queue tickets","action":"Each robot suddenly holds the next queue number; a ticket strip pulls the whole line forward and tears between them at the final tiles."},{"id":"chain-06","title":"Shared coat rack","action":"Robot antennas link into one flexible rack while their bases shift legally together."},{"id":"chain-07","title":"Bumper crop","action":"A squash travels through matching temporary bumpers, each disappearing after the chain settles."},{"id":"chain-08","title":"Pass the parcel","action":"A tiny parcel passes down the moving line and returns to the first robot at the endpoint."},{"id":"chain-09","title":"Single shopping list","action":"One long list unfurls across every back, then tears neatly into individual slips."},{"id":"chain-10","title":"Conjoined shadows","action":"Shadows merge into a shopping cart silhouette during movement and separate afterward."},{"id":"chain-11","title":"Late hats","action":"All head caps lag behind in a staggered wave while bases obey one movement clock."},{"id":"chain-12","title":"Queue sneeze","action":"Each chest compresses in sequence as the shove passes, without adding extra tile movement."},{"id":"chain-13","title":"Accordion train","action":"A concertina bridge connects every pair, stretches as the line moves, and folds away."},{"id":"chain-14","title":"Shelf book row","action":"Bodies tilt like books against one another while all feet stay on their legal tracks."},{"id":"chain-15","title":"Cable knitting","action":"Loose cables braid briefly between neighbors, then unweave at the destination."},{"id":"chain-16","title":"Many-handed courtesy","action":"Each robot produces one glove to guide the next, making a polite chain of unwanted escorts."},{"id":"chain-17","title":"Receipt relay","action":"A receipt exits the first robot and threads through every chest as the line shifts."},{"id":"chain-18","title":"Belly pistons","action":"Each belly piston nudges the next body on a rolling visual delay over synchronized movement."},{"id":"chain-19","title":"Domino faces","action":"Faces flip from calm to startled down the line while no robot actually topples."},{"id":"chain-20","title":"Shared roller board","action":"A long cosmetic skateboard appears under the line and splits into wheels at the endpoints."},{"id":"chain-21","title":"End robot conductor","action":"Last robot raises a baton and the whole unwilling line slides to a synchronized beat."},{"id":"chain-22","title":"Trolley coin chain","action":"Cart-lock chains stretch between bodies and release one by one after the legal move."},{"id":"chain-23","title":"Nested antennae","action":"Antennas telescope into a single long zigzag and spring apart afterward."},{"id":"chain-24","title":"Migrating dent","action":"A comic dent travels from first shell to last, then evaporates without damage."},{"id":"chain-25","title":"Sequential bowties","action":"Bowties pop outward in contact order while bases travel together."},{"id":"chain-26","title":"Inventory wave","action":"Each robot flips its inventory tag to the same new aisle number, then restores its normal tag."},{"id":"chain-27","title":"Shoulder staircase","action":"Shoulders lift in a traveling staircase pattern while feet stay grounded."},{"id":"chain-28","title":"Push paperwork","action":"A stamped authorization travels along the line after the shove has already begun."},{"id":"chain-29","title":"Caterpillar skirt","action":"Lower panels link into one rippling skirt across the moving robots."},{"id":"chain-30","title":"Floor tape train","action":"A strip of tape glides under all feet and peels up at the last robot."},{"id":"chain-31","title":"Waiting room seats","action":"Robots fold briefly into a line of chairs sliding forward, then stand together."},{"id":"chain-32","title":"Collective eyebrow","action":"One long eyebrow appears across the line, rises, then divides back into individual brows."},{"id":"chain-33","title":"Telescopic handles","action":"Handles unfold between robots like extendable luggage bars and retract at the end."},{"id":"chain-34","title":"Mop brigade","action":"Every second robot deploys a mop, polishing the chain's exact legal path."},{"id":"chain-35","title":"Shoelace loop","action":"Cables loop around neighboring ankles cosmetically and untie at the destination."},{"id":"chain-36","title":"Queue number mistake","action":"The last robot checks the first robot's number, shrugs, and all numbers flip back."},{"id":"chain-37","title":"Compressed shopping bags","action":"Paper-bag silhouettes crumple between bodies and puff open as they separate."},{"id":"chain-38","title":"Wobble echo","action":"The first robot's lean is echoed with diminishing magnitude down the line."},{"id":"chain-39","title":"Hat exchange","action":"Hats hop one robot forward during the shove, then hop back before the next beat."},{"id":"chain-40","title":"Rearview cascade","action":"Mirrors pop out down the line to inspect who started the push."},{"id":"chain-41","title":"One long sigh","action":"Chest vents open sequentially, forming one visible curl of cosmetic steam."},{"id":"chain-42","title":"Shelf rail","action":"A temporary display rail runs through the line's bases and retracts after the shift."},{"id":"chain-43","title":"Peeling price strip","action":"A long price strip peels from the front robot to the rear and rolls into a tiny coil."},{"id":"chain-44","title":"Shared luggage strap","action":"A strap wraps the whole line, tightens during contact, then releases at the endpoint."},{"id":"chain-45","title":"Antenna semaphore","action":"Each antenna points backward in accusation, one after another."},{"id":"chain-46","title":"Foot traffic signal","action":"Tiny heel lights turn from wait to go down the line while legal movement remains synchronized."},{"id":"chain-47","title":"Cardboard partitions","action":"Thin partitions rise between bodies, compress together, and fold away after movement."},{"id":"chain-48","title":"Long sleeve","action":"One oversized sleeve links everyone's arms and retracts into the first robot's pocket."},{"id":"chain-49","title":"Complaint counter","action":"A little counter at the rear clicks once per actual pushed robot, then disappears."},{"id":"chain-50","title":"Blocked queue statue","action":"When the chain is blocked, only a traveling eyebrow and body squash move; every base remains fixed."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"blocked","title":"Walls & blocked pushes","rule":"The blocked robot or chain remains on its original legal tiles with unchanged facing.","selected":["blocked-01","blocked-02","blocked-03","blocked-04","blocked-05"],"ideas":[{"id":"blocked-01","title":"Wall returns the receipt","action":"A receipt slides from the robot into the wall; the wall spits it back stamped RETURN, and the robot folds it quietly."},{"id":"blocked-02","title":"Chassis overtakes feet","action":"Feet halt at the obstacle while the soft chassis piles up over them; the robot peels itself back into its original silhouette."},{"id":"blocked-03","title":"Painted doorway","action":"The robot hurriedly draws a doorway on the wall, tries the painted knob, and watches the chalk door fall off as a flat sheet."},{"id":"blocked-04","title":"Wall has manners","action":"A tiny mechanical finger emerges from the wall and gently presses the robot's forehead back to its own tile."},{"id":"blocked-05","title":"Force goes upstairs","action":"The blocked shove travels up the robot's body, telescoping its antenna skyward before it retracts with embarrassed precision."},{"id":"blocked-06","title":"Doorbell unanswered","action":"Robot rings a bell attached to the wall and waits through one awkward blink."},{"id":"blocked-07","title":"Suction nose","action":"Its nose sticks to the wall, stretches backward, then releases onto its own tile."},{"id":"blocked-08","title":"Folded bumper","action":"A bumper folds like an envelope and is tucked back into the chassis."},{"id":"blocked-09","title":"Emergency reverse gear","action":"A gear spins wildly in a window while the robot remains completely stationary."},{"id":"blocked-10","title":"Paint tester","action":"Robot taps the wall, examines paint on its finger, and wipes the finger on itself."},{"id":"blocked-11","title":"Tiny argument","action":"A speech panel opens toward the wall; the wall stays still and the panel quietly closes."},{"id":"blocked-12","title":"Flattened hat","action":"The robot's hat slides down over its eyes from the stop, then pops back up."},{"id":"blocked-13","title":"Foot traffic jam","action":"Feet keep shuffling inside the tile while the body holds against the obstacle."},{"id":"blocked-14","title":"Measuring the impossible","action":"A ruler checks the gap, folds to zero, and returns to the robot's pocket."},{"id":"blocked-15","title":"Shelf bracket catch","action":"A bracket on the robot catches its own chin after impact and folds away."},{"id":"blocked-16","title":"Wall inspection sticker","action":"Robot places an INSPECTED sticker on the wall and pretends the stop was intentional."},{"id":"blocked-17","title":"Bumper-to-nose","action":"The bumper compresses all the way to its face, then reinflates slowly."},{"id":"blocked-18","title":"Invisible couch","action":"Robot reclines against the obstacle for a beat as if taking a break."},{"id":"blocked-19","title":"Manual page","action":"A tiny manual opens to a blank page and closes after the failed move."},{"id":"blocked-20","title":"Redrawn arrow","action":"Robot erases its cosmetic movement arrow and draws the same blocked arrow more cautiously."},{"id":"blocked-21","title":"Antenna corkscrew","action":"The sudden stop winds its antenna into a spiral that slowly unwinds."},{"id":"blocked-22","title":"Loose drawer spill","action":"A chest drawer slides open from the stop; its contents roll back inside immediately."},{"id":"blocked-23","title":"Hinge forehead","action":"The forehead flips up, absorbs the bonk, and clicks down again."},{"id":"blocked-24","title":"Dust outline","action":"A brief robot-shaped dust print appears on the wall and is polished away by a tiny arm."},{"id":"blocked-25","title":"Wheels under protest","action":"Wheels rotate inside their housings while the fixed base visibly refuses to move."},{"id":"blocked-26","title":"Paper bumper fan","action":"A paper fan unfolds at contact and collapses into one embarrassed pleat."},{"id":"blocked-27","title":"Headlight rebound","action":"The headlight cone squashes against the wall like jelly and returns to normal."},{"id":"blocked-28","title":"Socket check","action":"Robot tries plugging a cable into the blank wall, then retracts it."},{"id":"blocked-29","title":"Wall knock rhythm","action":"Three cautious knocks become one accidental head bump, followed by stillness."},{"id":"blocked-30","title":"Heel jack","action":"A heel jack raises the rear slightly, finds no legal passage, and lowers again."},{"id":"blocked-31","title":"Folded direction sign","action":"Its forward arrow bends at ninety degrees against the wall without changing facing."},{"id":"blocked-32","title":"Pocket detour map","action":"A map unfolds bigger than the robot, then crumples when no movement occurs."},{"id":"blocked-33","title":"Sweeper beard","action":"A mop-like beard splays against the wall and is combed back into shape."},{"id":"blocked-34","title":"Magnetic embarrassment","action":"A cosmetic magnet on its forehead sticks to the wall and needs both hands to peel off."},{"id":"blocked-35","title":"No-sale drawer","action":"A tiny cash drawer opens with an empty interior, then shuts after the failed move."},{"id":"blocked-36","title":"Telescopic torso","action":"The lower body stops while the upper body compresses downward and returns."},{"id":"blocked-37","title":"Barcode rejected","action":"A scan line crosses the wall and a small cross appears only on the robot's display."},{"id":"blocked-38","title":"Chalk footprint","action":"Robot draws a footprint beyond the wall, remembers the obstacle, and erases it from its own display."},{"id":"blocked-39","title":"Spring tail","action":"A tail shoots backward from the deceleration and coils neatly back inside."},{"id":"blocked-40","title":"Rubber palm","action":"An outstretched palm stretches flat against the wall, then peels finger by finger."},{"id":"blocked-41","title":"Shelf label reading","action":"Robot leans close to read an imaginary wall label and nods as though it meant to stop."},{"id":"blocked-42","title":"Faceplate slide","action":"The faceplate slides sideways from inertia and returns to center."},{"id":"blocked-43","title":"Tiny umbrella jam","action":"A protective umbrella opens against the wall and immediately folds itself inside out."},{"id":"blocked-44","title":"Footprint reconciliation","action":"Two projected footprints converge back onto the original tile after the blocked attempt."},{"id":"blocked-45","title":"Wall handshake denied","action":"A small hand offers a handshake to the wall, waits, then shakes its own other hand."},{"id":"blocked-46","title":"Packing peanut cushion","action":"One peanut appears at contact, flattens, and is pocketed with solemn care."},{"id":"blocked-47","title":"Stop button self-press","action":"Robot's own chin lands on its stop button during the bonk and lifts again."},{"id":"blocked-48","title":"Customer ticket","action":"A numbered ticket prints from the wall; the robot takes it but remains waiting on its tile."},{"id":"blocked-49","title":"Shoulder shrug echo","action":"The torso shrugs, then the backpack shrugs a beat later."},{"id":"blocked-50","title":"Blocked chain thermometer","action":"A cosmetic pressure gauge rises through the stationary chain, then gently vents at the last antenna."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"edge","title":"Leaving the map","rule":"Robot becomes off-board at the resolved edge crossing and cannot interact until its legal reboot.","selected":["edge-01","edge-02","edge-03","edge-04","edge-05"],"ideas":[{"id":"edge-01","title":"Floor sample","action":"Robot lifts the final tile corner as if inspecting flooring, discovers there is no more floor, and folds downward with the sample."},{"id":"edge-02","title":"Barcode scan out","action":"The edge scans the departing robot into horizontal barcode strips that descend one by one, leaving its ID briefly on a dangling label."},{"id":"edge-03","title":"Last aisle curtain","action":"Robot pushes through an invisible stockroom curtain; the curtain's bottom swings outward revealing the drop, and both vanish below the edge."},{"id":"edge-04","title":"Gravity checks the clipboard","action":"The robot hangs beyond the edge while a little clipboard arm ticks a box; the body drops instantly, followed by the late clipboard."},{"id":"edge-05","title":"Caster keeps shopping","action":"Chassis drops out of view while its loose caster makes one serene circle in the air, notices the missing body, and dives after it."},{"id":"edge-06","title":"Shadow resigns first","action":"The shadow slips over the edge before the robot follows it."},{"id":"edge-07","title":"Glass zipper","action":"The robot unzips into vertical luminous ribs that fall in order."},{"id":"edge-08","title":"Eye stays level","action":"The body tips away while the eye holds level, then drops last."},{"id":"edge-09","title":"Polite horizon","action":"The edge bows downward under the departing robot and springs back empty."},{"id":"edge-10","title":"Light ladder fails","action":"A ladder of light grows beneath the robot but its rungs dissolve upward."},{"id":"edge-11","title":"Missing reflection","action":"Robot looks down for its reflection; the reflection waves from below and disappears."},{"id":"edge-12","title":"One-frame scaffold","action":"A bright scaffold flashes under its feet, folds instantly, and falls with it."},{"id":"edge-13","title":"Spherical surrender","action":"Limbs tuck into a polished ball that rolls cleanly over the edge."},{"id":"edge-14","title":"Gravity curtain","action":"The robot pulls a luminous vertical line that becomes its falling trajectory."},{"id":"edge-15","title":"Late footprint","action":"A glowing footprint hangs over the void after the body drops, then blinks out."},{"id":"edge-16","title":"Antenna lifeline","action":"Antenna stretches toward the board, reaches short, and retracts as it falls."},{"id":"edge-17","title":"Prism separation","action":"Chassis separates into nested prisms that descend at slightly different speeds."},{"id":"edge-18","title":"Edge handshake","action":"A tiny hand reaches up from the robot to shake the edge goodbye."},{"id":"edge-19","title":"Collapsed perspective","action":"Robot flattens to a luminous line against the horizon, then slides downward."},{"id":"edge-20","title":"Glass eyelid","action":"The eye closes like a heavy glass shutter as the body tips out of view."},{"id":"edge-21","title":"Orbit abandoned","action":"A cosmetic ring keeps orbiting the absent body, then spirals down after it."},{"id":"edge-22","title":"Elastic ankles","action":"Feet catch the edge visually for a beat while the torso stretches down and releases."},{"id":"edge-23","title":"Light bookmark","action":"A thin luminous tab remains at the crossing, folds over, and vanishes."},{"id":"edge-24","title":"Personal horizon tilt","action":"The robot's internal horizon rotates while the actual board remains still."},{"id":"edge-25","title":"Silent air stairs","action":"Feet mime two descending steps in empty space before the whole body drops."},{"id":"edge-26","title":"Swallowed spotlight","action":"Its spotlight cone points down, narrows, and pulls the chassis into darkness."},{"id":"edge-27","title":"Handle without suitcase","action":"A small handle remains aloft as the robot falls, then snaps after it."},{"id":"edge-28","title":"Topology shrug","action":"The body turns inside out like a glass glove while falling below the board."},{"id":"edge-29","title":"Refraction lag","action":"A refracted duplicate trails the falling robot and merges with it below the edge."},{"id":"edge-30","title":"Edge inspection","action":"Robot bends to inspect the edge and its back half tips over its head."},{"id":"edge-31","title":"Gravity dial","action":"A small dial on its chest turns from horizontal to vertical just before the fall."},{"id":"edge-32","title":"Expanding pupil","action":"The eye grows wide until it fills the face, then shrinks into the void."},{"id":"edge-33","title":"Light-string pluck","action":"The edge emits one visible string vibration as the robot crosses and disappears."},{"id":"edge-34","title":"Body becomes arrow","action":"Chassis folds into a downward arrow and falls along its own point."},{"id":"edge-35","title":"Loose reflection sheet","action":"Its reflection peels from the glass board and follows the departing body."},{"id":"edge-36","title":"Hovering knees","action":"Knees hold their pose briefly after feet disappear, then the torso follows."},{"id":"edge-37","title":"Luminous seam unravel","action":"A single bright seam unravels the robot into a falling spiral."},{"id":"edge-38","title":"Wrong-way stabilizer","action":"A stabilizer unfolds above the robot, notices the mistake, and folds as it drops."},{"id":"edge-39","title":"Glass bead cascade","action":"Body joints become beads sliding down an invisible thread below the edge."},{"id":"edge-40","title":"Last blink invoice","action":"The eye blinks twice at the board, then switches off as the body drops."},{"id":"edge-41","title":"Inverted umbrella","action":"A light canopy opens below the robot and collapses upward around it."},{"id":"edge-42","title":"Floor echo","action":"A faint tile-shaped echo follows the robot downward and fades before reaching darkness."},{"id":"edge-43","title":"Handrail mirage","action":"The robot grabs a light handrail that politely folds into its own wrist."},{"id":"edge-44","title":"Nested silhouettes","action":"Smaller silhouettes collapse inward toward the falling chassis until only the real body remains."},{"id":"edge-45","title":"Eye tracks home","action":"The eye keeps tracking the board while the chassis rotates below it."},{"id":"edge-46","title":"Tightrope outline","action":"A thin board outline stretches under its feet, snaps harmlessly, and retracts."},{"id":"edge-47","title":"Air pocket","action":"The robot briefly sits inside a clear bubble that opens at the bottom."},{"id":"edge-48","title":"Falling coat","action":"The outer shell slips downward like a coat, followed immediately by its bright core."},{"id":"edge-49","title":"One last polish","action":"A small arm wipes the edge while the rest of the robot falls."},{"id":"edge-50","title":"Gravity hinge","action":"The body pivots around an imaginary hinge at the edge, then detaches cleanly."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"pit","title":"Falling into a pit","rule":"Robot disappears through the pit and remains off-board until the legal reboot.","selected":["pit-01","pit-02","pit-03","pit-04","pit-05"],"ideas":[{"id":"pit-01","title":"Self-checkout bagging","action":"The pit unfolds paper-bag gussets around the robot; handles rise, the bag neatly closes, then the entire package drops through."},{"id":"pit-02","title":"Drain with dignity","action":"The robot circles the pit rim once as a flat spiral, keeps its eyes level until the last moment, then its antenna plugs the hole briefly."},{"id":"pit-03","title":"Wrong elevator","action":"Tiny elevator doors stand up around the robot; a down arrow lights, the roof sinks into the pit, and the doors fold flat again."},{"id":"pit-04","title":"Measuring tape rescue","action":"Robot fires a measuring tape toward the rim; it measures the gap, retracts with a useless satisfied click, and the robot falls."},{"id":"pit-05","title":"Origami parcel","action":"Robot folds itself into an impossibly neat flat parcel that fits the pit, drops through edge-first, and leaves one packing peanut hovering behind."},{"id":"pit-06","title":"Iris aperture","action":"The pit opens a luminous iris around the descending robot and closes empty."},{"id":"pit-07","title":"Glass marble drain","action":"Robot compacts into a marble that spirals once around the pit and drops."},{"id":"pit-08","title":"Eye periscope goodbye","action":"The body vanishes first; its eye rises on a stalk, looks around, and retracts below."},{"id":"pit-09","title":"Folding floor lip","action":"Pit edges fold upward like a luminous envelope around the falling robot."},{"id":"pit-10","title":"Light onion","action":"Outer sh lows snack","action":"The eye follows the charge all the way into the body, then looks forward again."},{"id":"energy-43","title":"Light hinge boost","action":"Small joint lights brighten in sequence after the actual energy increment."},{"id":"energy-44","title":"Core balances new bead","action":"The core briefly juggles the incoming bead before absorbing it."},{"id":"energy-45","title":"Charging collar","action":"A ring rises from the tile to the chest, deposits the charge, and collapses inward."},{"id":"energy-46","title":"Battery window wipe","action":"A small wiper clears the energy display to reveal the correct updated value."},{"id":"energy-47","title":"Contented shell stretch","action":"The shell stretches upward slightly after charging, then returns to its normal dimensions."},{"id":"energy-48","title":"Overflow courtesy","action":"At the energy cap, the intake closes politely and no additional charge enters."},{"id":"energy-49","title":"Counted spark ladder","action":"Exactly one rung per gained energy unit lights inside the chassis, then becomes the display."},{"id":"energy-50","title":"Quiet satisfied blink","action":"The core updates first; the eye gives one slow satisfied blink afterward."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"checkpoint","title":"Checkpoints","rule":"Credit only the next required checkpoint, showing the actual new checkpoint count.","selected":["checkpoint-01","checkpoint-02","checkpoint-03","checkpoint-04","checkpoint-05"],"ideas":[{"id":"checkpoint-01","title":"Time-clock punch","action":"Checkpoint punches a tiny timecard protruding from the robot; the new hole becomes the actual checkpoint numeral before the card retracts."},{"id":"checkpoint-02","title":"Velvet rope approval","action":"A miniature velvet rope opens ceremoniously around the robot, gets tangled for one beat, and snaps into a clean ring with the earned number."},{"id":"checkpoint-03","title":"Shelf stamp","action":"A giant stock stamp descends, stops just above the robot's head, and stamps only its shadow with the earned checkpoint number."},{"id":"checkpoint-04","title":"Receipt crown","action":"A receipt prints from the checkpoint, folds itself into a small numbered crown on the robot, then packs into a badge."},{"id":"checkpoint-05","title":"Security gate courtesy","action":"Two tiny security gates scan the robot, almost beep, then bow outward while the earned checkpoint number clicks into place."},{"id":"checkpoint-06","title":"Light fingerprint","action":"The checkpoint reads the robot's palm and lights only the newly earned checkpoint number."},{"id":"checkpoint-07","title":"Glass arch nod","action":"A clear arch dips toward the robot as the real checkpoint count advances."},{"id":"checkpoint-08","title":"Core badge","action":"A small numbered light badge forms inside the chassis at the moment of valid credit."},{"id":"checkpoint-09","title":"Eye recognition","action":"The checkpoint's tiny eye and the robot's eye blink in sequence before the number updates."},{"id":"checkpoint-10","title":"Holographic handshake","action":"A light hand rises from the tile, congratulates the robot, and dissolves into the earned numeral."},{"id":"checkpoint-11","title":"Floor ring locks","action":"A segmented ring around the tile closes one actual checkpoint segment and fades."},{"id":"checkpoint-12","title":"Glass stamp shadow","action":"A transparent stamp touches only the robot's shadow, leaving the correct number briefly visible."},{"id":"checkpoint-13","title":"Antenna pennant","action":"A tiny numbered pennant grows from the antenna and folds into a small badge."},{"id":"checkpoint-14","title":"Checkpoint aperture","action":"An iris opens beneath the robot, scans upward, and closes with the new count."},{"id":"checkpoint-15","title":"Core and beacon duet","action":"The robot core and checkpoint beacon pulse once together on valid arrival."},{"id":"checkpoint-16","title":"Light ribbon measure","action":"A ribbon measures the robot's height, then folds into the earned checkpoint numeral."},{"id":"checkpoint-17","title":"Glass pedestal nod","action":"A shallow pedestal rises a fraction under the stationary robot and settles again."},{"id":"checkpoint-18","title":"Eye wears medal","action":"A small numbered ring frames the eye briefly before sliding onto the chest."},{"id":"checkpoint-19","title":"Footprint signature","action":"The robot's footprints glow as a signature, then merge into the checkpoint count."},{"id":"checkpoint-20","title":"Tiny official","action":"A small geometric official emerges from the beacon, nods, and folds away."},{"id":"checkpoint-21","title":"Checkpoint lens focus","action":"A lens focuses on the robot, clicks sharp, and reveals the actual earned number."},{"id":"checkpoint-22","title":"Light laurel hinge","action":"Two abstract light branches hinge around the robot and close into a compact badge."},{"id":"checkpoint-23","title":"Glass bell recognition","action":"A transparent bell shape expands once around the beacon without obscuring the board."},{"id":"checkpoint-24","title":"Progress notch","action":"A visible notch clicks into the robot's checkpoint display, matching the true count."},{"id":"checkpoint-25","title":"Reflection congratulations","action":"The robot's reflection gives a tiny bow while the body stays upright."},{"id":"checkpoint-26","title":"Beacon salutes","action":"The checkpoint beacon tilts like a salute and returns to its neutral position."},{"id":"checkpoint-27","title":"Number unfolds","action":"The earned numeral unfolds from a thin line into a readable three-dimensional shape."},{"id":"checkpoint-28","title":"Eye-to-beacon glance","action":"Robot and beacon exchange a quick glance before the count updates."},{"id":"checkpoint-29","title":"Luminous seal","action":"A circular seal forms on the chest, stamps the actual checkpoint number, and shrinks away."},{"id":"checkpoint-30","title":"Glass ticket slot","action":"A small slot accepts a light token and returns the earned-number badge."},{"id":"checkpoint-31","title":"Checkpoint halo parking","action":"A thin halo descends, pauses around the robot, and parks briefly behind its head."},{"id":"checkpoint-32","title":"Core staircase","action":"A small internal staircase gains one step for the newly earned checkpoint."},{"id":"checkpoint-33","title":"Antenna height mark","action":"A temporary height mark appears beside the antenna, then becomes the progress numeral."},{"id":"checkpoint-34","title":"Light clasp","action":"Two halves of a badge clasp together on the chassis at valid checkpoint credit."},{"id":"checkpoint-35","title":"Floor tile applause","action":"Four tiny tile-edge flaps lift in sequence and settle around the stationary robot."},{"id":"checkpoint-36","title":"Beacon opens flower","action":"Geometric beacon petals open to reveal the earned number, then fold closed."},{"id":"checkpoint-37","title":"Number orbit","action":"The actual checkpoint numeral orbits the robot once and docks on its display."},{"id":"checkpoint-38","title":"Tiny velvet-light gate","action":"Two light posts bow apart around the robot without moving its base."},{"id":"checkpoint-39","title":"Core receives stamp","action":"A stamp reaches through the transparent shell cosmetically and marks the internal progress display."},{"id":"checkpoint-40","title":"Glass ribbon curl","action":"A narrow ribbon curls into the exact earned numeral above the tile."},{"id":"checkpoint-41","title":"Eye pupil star","action":"The pupil briefly becomes an abstract many-point shape, then returns to its normal circle."},{"id":"checkpoint-42","title":"Checkpoint handoff","action":"The beacon passes a small light block to the robot, which slots it into its progress display."},{"id":"checkpoint-43","title":"Floor reflection number","action":"The earned numeral appears in the floor reflection before rising to the normal display."},{"id":"checkpoint-44","title":"Antenna flag check","action":"The antenna bends toward the checkpoint beacon, touches light to light, and straightens."},{"id":"checkpoint-45","title":"Measured nod","action":"The robot nods once while the checkpoint count clicks to the authoritative value."},{"id":"checkpoint-46","title":"Glass seal peel","action":"A clear seal peels from the beacon and adheres briefly to the chassis."},{"id":"checkpoint-47","title":"Progress rail","action":"A small marker advances one real notch on a short rail inside the robot."},{"id":"checkpoint-48","title":"Checkpoint wink through glass","action":"The beacon light refracts through the robot and resolves into the earned number."},{"id":"checkpoint-49","title":"Wrong-order courtesy","action":"At a non-next checkpoint, the beacon gives a small neutral nod but awards no number or progress."},{"id":"checkpoint-50","title":"Final checkpoint transition","action":"The final valid checkpoint numeral locks first, then hands the visual emphasis to the actual winner celebration."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"damage","title":"SPAM, Haywire & card replacement","rule":"Show the real damage cards or replacement; only the resolved card changes gameplay.","selected":["damage-01","damage-02","damage-03","damage-04","damage-05"],"ideas":[{"id":"damage-01","title":"Junk-mail slot","action":"SPAM envelopes force themselves into the robot's mail slot; it posts them back out, but a conveyor quietly returns the same counted envelopes to its deck."},{"id":"damage-02","title":"Misfiled instruction","action":"The real replacement card crawls from a filing drawer, kicks out the SPAM card, and squares itself inside the active register."},{"id":"damage-03","title":"Haywire marionette","action":"A visible Haywire card briefly tugs the robot's cosmetic limbs with tangled strings; the strings straighten into the actual resolved command arrow."},{"id":"damage-04","title":"Coupon avalanche","action":"A tiny coupon curls out, then unfolds into an absurd accordion; it refolds into precisely the damage cards actually awarded."},{"id":"damage-05","title":"Printer chews the program","action":"The active card enters a jammed printer; rollers argue in opposite directions, then eject exactly the legal replacement face-up."},{"id":"damage-06","title":"Crack finds the card","action":"A luminous crack runs across the shell, turns a right angle, and becomes the border of the actual damage card."},{"id":"damage-07","title":"Wrong reflection","action":"The reflection obeys a different instruction for one beat; the robot pins it beneath the real Haywire card."},{"id":"damage-08","title":"Dead pixel eviction","action":"A dead pixel enlarges on the eye, is plucked out, and unfolds into one counted SPAM card."},{"id":"damage-09","title":"Glass splinter alphabet","action":"Harmless light splinters hover inside the shell, align into the actual card symbol, and slide into its assigned slot."},{"id":"damage-10","title":"Card has gravity","action":"A damage card dents the robot's light pool like a heavy object; the pool springs flat when the card enters the deck."},{"id":"damage-11","title":"Misaligned transparency","action":"The robot's translucent layers slip sideways like bad color registration, then align around the replacement card."},{"id":"damage-12","title":"Instruction grows roots","action":"The Haywire card grows fine luminous roots into a register slot; they retract into its resolved command symbol."},{"id":"damage-13","title":"Eye tries to read sideways","action":"A damage card rotates away whenever the eye tilts toward it, finally surrendering flat inside its real destination slot."},{"id":"damage-14","title":"Unwanted bookmark","action":"A thin SPAM strip worms between the deck's glass pages and proudly pops up as a bookmark."},{"id":"damage-15","title":"Static comb","action":"A comb passes through the eye's static and gathers it into precisely the damage cards awarded."},{"id":"damage-16","title":"Bent command shadow","action":"The outgoing command's shadow bends into the replacement symbol before the actual card flips to match it."},{"id":"damage-17","title":"Paperweight reversal","action":"The robot puts a glass weight on SPAM; the card lifts the weight and crawls into the discard anyway."},{"id":"damage-18","title":"Broken subtitle","action":"A luminous command glyph loses a stroke; the lost stroke pulls a replacement card into the register."},{"id":"damage-19","title":"Card-shaped sneeze","action":"The robot's eye contracts, expands, and expels a flat SPAM rectangle directly into its actual deck destination."},{"id":"damage-20","title":"Error zipper","action":"A zipper of light opens down the shell, reveals the damage card, then closes behind it without opening the body physically."},{"id":"damage-21","title":"Interference knot","action":"Two command traces knot together; the legal replacement slips through the knot and pulls it straight."},{"id":"damage-22","title":"Bad card walks uphill","action":"SPAM climbs the curved shell against gravity, pauses at the eye, and drops into the waiting discard slot."},{"id":"damage-23","title":"Face-down magnet","action":"The Haywire card keeps flipping face-down under an invisible magnetic pull until its correct reveal moment."},{"id":"damage-24","title":"Fault line filing","action":"A fault line divides the light pool into index tabs; the actual damage cards sink into their proper tabs."},{"id":"damage-25","title":"Borrowed eye","action":"The damage card briefly borrows the robot's eye to inspect its own symbol, then hands the light back."},{"id":"damage-26","title":"One stubborn corner","action":"Three corners of the damage card enter its slot; the fourth resists until the robot gently folds it in."},{"id":"damage-27","title":"Command molt","action":"The old command peels away like a transparent skin, revealing the actual replacement beneath."},{"id":"damage-28","title":"Glass tick","action":"A tiny tick of light runs around the body and stops on a damage card, becoming its corner mark."},{"id":"damage-29","title":"Unread stack","action":"One SPAM card makes its own reflection look like a huge stack; the reflection collapses to the true count."},{"id":"damage-30","title":"Electrostatic fur","action":"Fine light filaments stand upright on the shell, then sweep flat into the real Haywire card's pattern."},{"id":"damage-31","title":"Slot hiccup","action":"The register slot swallows the replacement halfway, hiccups it out, and neatly accepts it on the second attempt."},{"id":"damage-32","title":"Wrong-size instruction","action":"The real replacement is temporarily too large for its slot; its border contracts while the command symbol holds its size."},{"id":"damage-33","title":"Self-addressed envelope","action":"SPAM draws a return route back to the robot, follows that route, and lands in its legal discard location."},{"id":"damage-34","title":"Card between dimensions","action":"The damage card arrives edge-on as a hairline, twists into view, and clicks into the correct stack."},{"id":"damage-35","title":"Command tether","action":"The outgoing card leaves a stretchy light tether; the replacement snaps it loose and takes the register."},{"id":"damage-36","title":"Prism cough","action":"A prism inside the shell separates the eye's light into three slabs that recombine as the actual damage card."},{"id":"damage-37","title":"Deck burp","action":"The discard stack bulges once as the damage card arrives, then settles with the new card visibly on top."},{"id":"damage-38","title":"Haywire pendulum","action":"A Haywire glyph swings inside a glass pendulum, nearly settles on a false direction, then locks to the resolved command."},{"id":"damage-39","title":"Tiny inspection mirror","action":"The robot checks behind itself with a mirror and discovers SPAM already waiting inside the reflection of its deck."},{"id":"damage-40","title":"Instruction scab","action":"A bright patch grows over the hit point, peels away intact, and becomes one actual damage card."},{"id":"damage-41","title":"Slot grows teeth","action":"The active register sprouts tiny glass teeth, chews away the old symbol, and opens around the legal replacement."},{"id":"damage-42","title":"Light pool typo","action":"The pool beneath the robot briefly spells the wrong command; the replacement card presses it into the correct symbol."},{"id":"damage-43","title":"Folded interference","action":"A strip of visual interference folds into a compact card, retaining the exact SPAM or Haywire identity received."},{"id":"damage-44","title":"Card in the highlight","action":"The shell's specular highlight stretches into a card silhouette, detaches, and joins the real damage pile."},{"id":"damage-45","title":"Wrong-way roller","action":"A tiny roller paints the replacement symbol backward, pauses, flips its transparent film, and seats the now-correct card."},{"id":"damage-46","title":"Damage constellation","action":"One light point per awarded card appears inside the shell; each point expands into its actual card and exits separately."},{"id":"damage-47","title":"Stolen pause","action":"The robot freezes cosmetically while a Haywire card strolls across its face and takes its assigned register position."},{"id":"damage-48","title":"Overeager eraser","action":"A glass eraser rubs the old command completely away, then retreats as the real replacement redraws itself."},{"id":"damage-49","title":"Card sticks to the ceiling","action":"SPAM clings to the inside top of the shell until the robot taps once and it drops into the discard chute."},{"id":"damage-50","title":"Hollow instruction","action":"The outgoing command becomes an empty glass mold; the replacement pours through and solidifies in its proper slot."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"shield","title":"Shield & damage prevention","rule":"Communicate blocked damage only when a real shield prevents it; the beam and board state remain authoritative.","selected":["shield-01","shield-02","shield-03","shield-04","shield-05"],"ideas":[{"id":"shield-01","title":"Warranty umbrella","action":"A warranty booklet unfolds into a tiny umbrella at the impact side; the laser beads on it and drains harmlessly into its spine."},{"id":"shield-02","title":"Return-to-sender stamp","action":"A shield plate stamps the incoming light RETURN, folds it into an envelope, and shreds it locally without creating a reflected attack."},{"id":"shield-03","title":"Bubble-wrap armor","action":"One clear packing bubble swells at the impact point, absorbs the pulse with a satisfying inward pop, and smooths back into the chassis."},{"id":"shield-04","title":"Sliding service shutter","action":"A service shutter drops over the robot a split second before impact; a CLOSED sign flips once and the shutter lifts immediately."},{"id":"shield-05","title":"Laser lint roller","action":"A little roller sweeps over the impact side and collects the beam as a bright sticky stripe; the used sheet peels off and evaporates."},{"id":"shield-06","title":"Light knot","action":"The shield ties the incoming beam into a small knot, tightens it to a point, and extinguishes it locally."},{"id":"shield-07","title":"Pocket eclipse","action":"A dark glass disk slides across the impact point like a miniature eclipse and absorbs the pulse behind its rim."},{"id":"shield-08","title":"Beam gets laminated","action":"Two transparent shield sheets close around the laser, flatten it, and retract the harmless strip into the shell."},{"id":"shield-09","title":"Unwelcome guest","action":"A tiny shield door opens, sees the beam, immediately closes, and leaves the pulse crumpled against the exterior."},{"id":"shield-10","title":"Glass gill","action":"A row of gills opens at impact; the light passes into them and fades without emerging elsewhere."},{"id":"shield-11","title":"Light swallowed sideways","action":"The shield twists the beam flat against its own surface and rolls it into a bright bead that disappears."},{"id":"shield-12","title":"Polite napkin","action":"A thin plane of shield light dabs the incoming pulse once, folds itself neatly, and vanishes beside the robot."},{"id":"shield-13","title":"Door chain","action":"The shield opens a crack on a short chain, admits one glimpse of the beam, and slams shut before contact."},{"id":"shield-14","title":"Accordion brake","action":"The shield compresses the beam into closely spaced light folds, then closes the folds until no pulse remains."},{"id":"shield-15","title":"Optical cork","action":"A small glass cork grows into the impact point; the beam stops against it and the cork pops inward harmlessly."},{"id":"shield-16","title":"Beam under glass","action":"A transparent bell jar drops over the impact, traps the red light, and darkens from the bottom up."},{"id":"shield-17","title":"Light gets combed","action":"Fine shield teeth separate the pulse into hair-thin strands and sweep every strand into a local collection groove."},{"id":"shield-18","title":"Impact dimple","action":"The shield forms an inward dimple around the pulse, turns the dimple inside out, and releases no returning beam."},{"id":"shield-19","title":"Tiny blackout blind","action":"A blackout blind snaps down only across the impact patch, bulges once, then rolls away empty."},{"id":"shield-20","title":"Beam in a bottle","action":"The incoming pulse narrows into a tiny shield bottle; its stopper seats and the trapped light gently goes out."},{"id":"shield-21","title":"Stretched moment","action":"The beam visibly slows within a thick glass shield layer, shortens from the tail, and disappears before reaching the body."},{"id":"shield-22","title":"Local whirlpool","action":"The shield surface rotates a coin-sized whirlpool that winds the beam inward without affecting the robot's orientation."},{"id":"shield-23","title":"Light bite","action":"A round notch opens in the shield and takes one clean bite out of the pulse, then closes without a mark."},{"id":"shield-24","title":"Pulse gets ironed","action":"A tiny shield plate sweeps across the red pulse, pressing it into a hairline that cools to darkness."},{"id":"shield-25","title":"Two-pane argument","action":"Two glass panes trade places rapidly at impact, trap the beam between them, then settle into one intact shield."},{"id":"shield-26","title":"Beam zipper","action":"A zipper closes along the incoming light from its endpoint backward, swallowing it into the shield seam."},{"id":"shield-27","title":"Squeegee shield","action":"A luminous squeegee clears the pulse off the shield surface into a little drain at the robot's own base."},{"id":"shield-28","title":"One-way prism","action":"A shield prism refracts the pulse through an impossibly long internal path until it fades entirely inside the glass."},{"id":"shield-29","title":"Shield shrugs","action":"The shield's impact-side shoulder rises, catches the pulse in a crease, and lowers after the red light dies."},{"id":"shield-30","title":"Punch card defense","action":"The pulse punches a bright dot into the shield; the dot slides into a harmless row of spent marks and fades."},{"id":"shield-31","title":"Glass eyelid","action":"A large translucent eyelid closes over the impact side, flutters at the pulse, then opens onto an undamaged shell."},{"id":"shield-32","title":"Pulse gets weighed","action":"A miniature shield balance receives the beam, tips with absurd heaviness, and empties its light into a local absorber."},{"id":"shield-33","title":"Rubber-light dent","action":"The shield stretches around the beam like elastic glass, holds a comic pause, and collapses inward after absorption."},{"id":"shield-34","title":"Light folded into silence","action":"The red pulse folds in half repeatedly against the shield until it becomes a tiny dark square."},{"id":"shield-35","title":"Shield catches its reflection","action":"The shield's reflection rises to meet the pulse, sandwiches it against the real surface, and sinks back empty."},{"id":"shield-36","title":"Microscopic revolving door","action":"A tiny revolving shield door takes the pulse into an opaque compartment and completes its turn without releasing it."},{"id":"shield-37","title":"Local hourglass","action":"The pulse becomes fine light grains inside a shield hourglass; the last grain extinguishes before the glass retracts."},{"id":"shield-38","title":"Beam loses its edge","action":"The sharp incoming line turns soft and rounded inside the shield, contracts into a dull sphere, and fades."},{"id":"shield-39","title":"Shield stitches itself","action":"The pulse appears to split the shield; two rows of light stitches instantly close around and consume the red seam."},{"id":"shield-40","title":"Impact on mute","action":"A shield dial turns one notch at impact; the beam's glow visibly reduces to zero while its endpoint stays fixed."},{"id":"shield-41","title":"Glass sponge","action":"A porous glass patch absorbs the pulse cell by cell, swells slightly, then drains back to clear."},{"id":"shield-42","title":"Finger trap","action":"Two shield loops catch the pulse; its apparent attempt to advance only tightens them until the light vanishes."},{"id":"shield-43","title":"Beam tucked in","action":"A thin shield flap folds over the arriving pulse like a blanket and smooths its last bright corner flat."},{"id":"shield-44","title":"Small ceremonial lid","action":"A delicate lid rises at the impact point, receives the pulse beneath it, and closes with exaggerated care."},{"id":"shield-45","title":"Unthread the laser","action":"The shield finds the pulse's loose end and unravels it into a short thread that retracts into the same impact point."},{"id":"shield-46","title":"Light labyrinth","action":"The pulse enters a visible maze inside the shield, takes a comically circuitous route, and fades at the dead end."},{"id":"shield-47","title":"Shield checks the pulse","action":"A tiny glass caliper closes around the incoming line, measures it, and squeezes it to zero width."},{"id":"shield-48","title":"Impact becomes a crease","action":"The pulse folds the shield slightly; the robot smooths the crease with one small stroke after the light is absorbed."},{"id":"shield-49","title":"One-use glass scale","action":"A single scale on the shield lifts, catches the pulse beneath it, cools dark, and slides back flush."},{"id":"shield-50","title":"Light swallowed by its shadow","action":"A tiny dark shadow grows from the pulse's endpoint, overtakes the red line locally, and disappears with it."}],"lumenAdaptation":"Render transient props as restrained light constructs around smoked-glass, single-eye geometric robots; keep the board and legal endpoints readable."},{"id":"upgrade","title":"Upgrades & special effects","rule":"Each study is cosmetic to its named legal upgrade: installation, EMP, swap, tractor, or displacement resolves exactly once.","selected":["upgrade-01","upgrade-02","upgrade-03","upgrade-04","upgrade-05"],"ideas":[{"id":"upgrade-01","title":"Tool chooses the owner","action":"An installed tool hops from its blister pack, tries several mounting points, then clicks onto the correct robot without altering its position."},{"id":"upgrade-02","title":"EMP store-closing wave","action":"For a legal EMP, a circular wave turns miniature OPEN signs to CLOSED in sequence and they reopen as the effect ends; affected robots match the real target set."},{"id":"upgrade-03","title":"Swap changing rooms","action":"For a legal swap, two fitting-room curtains spin around the affected robots and open with their positions exchanged, preserving their authoritative facings."},{"id":"upgrade-04","title":"Tractor tape measure","action":"For a legal tractor effect, a tape measure hooks the target's base and retracts only the resolved distance, then flicks its hook free."},{"id":"upgrade-05","title":"Displacement drawer trick","action":"For a legal displacement, the target folds into a shallow drawer that slides along the resolved path and opens at its exact new tile."},{"id":"upgrade-06","title":"Highlight installation","action":"For installation, the tool travels along the robot's specular highlight before peeling into solid form at its actual mounting point."},{"id":"upgrade-07","title":"Glass grows a socket","action":"For installation, the shell dimples into a precisely fitted socket; the new tool falls into it and the surface closes flush."},{"id":"upgrade-08","title":"Tool assembles its shadow","action":"For installation, the tool's shadow arrives first and lays out the parts; the real tool drops into the completed silhouette."},{"id":"upgrade-09","title":"Magnetic hesitation","action":"For installation, a tool snaps toward the wrong cosmetic socket, stops short, and rotates into the correct mount."},{"id":"upgrade-10","title":"Inside-out fitting","action":"For installation, the shell briefly turns transparent while the tool is threaded through it and locked on the exterior."},{"id":"upgrade-11","title":"Tool wakes its owner","action":"For installation, the tool gently taps the robot's eye twice before attaching; the robot remains on its tile throughout."},{"id":"upgrade-12","title":"One missing fastener","action":"For installation, the tool waits motionless while one tiny screw rolls around the shell and seats itself last."},{"id":"upgrade-13","title":"Light grows hardware","action":"For installation, a thin drawing of the tool extrudes outward from the shell and gains polished material one edge at a time."},{"id":"upgrade-14","title":"Reflection test fit","action":"For installation, a reflected tool tries the mounting posi ap, transparent sleeves close around both robots, cross as luminous outlines, and open on their exchanged positions."},{"id":"upgrade-26","title":"Swap negative space","action":"For a legal swap, each robot becomes a robot-shaped hole in light; the holes trade places and refill with the correct bodies."},{"id":"upgrade-27","title":"Swap bookends","action":"For a legal swap, two upright glass pages fold inward and reopen with the robots exchanged, facing markers restored exactly."},{"id":"upgrade-28","title":"Swap sliding highlights","action":"For a legal swap, the robots compress into their brightest highlights, slide to the opposite resolved positions, and expand again."},{"id":"upgrade-29","title":"Swap nested outlines","action":"For a legal swap, one robot's outline expands while the other's contracts; the two outlines invert and reveal exchanged bodies."},{"id":"upgrade-30","title":"Swap eye rendezvous","action":"For a legal swap, the eye lights meet between the robots, pass each other politely, and pull their bodies into the exchanged tiles."},{"id":"upgrade-31","title":"Swap optical curtains","action":"For a legal swap, refraction bands sweep across the two occupied tiles and reveal the opposite robot behind each band."},{"id":"upgrade-32","title":"Swap compressed portraits","action":"For a legal swap, each robot flattens into a thin glass portrait; the portraits exchange and regain depth at the legal endpoints."},{"id":"upgrade-33","title":"Tractor elastic shadow","action":"A legal tractor stretches the target's shadow toward the source, then lets the target catch up by exactly the resolved distance."},{"id":"upgrade-34","title":"Tractor glass tendon","action":"A legal tractor grows one transparent tendon between source and target; its shortening draws the target to the resolved tile."},{"id":"upgrade-35","title":"Tractor folding ruler","action":"A legal tractor unfolds a luminous jointed ruler to the target and refolds only the joints corresponding to the le l's reflected horizon folds down like a closing laptop, covering the eye without moving the robot's base."},{"id":"shutdown-16","title":"Tiny night watch","action":"A miniature light eye checks left and right above the shell, returns to its socket, and shuts the last aperture."},{"id":"shutdown-17","title":"Nested shell","action":"Successively smaller shell sections telescope inward until the robot rests as a compact polished capsule."},{"id":"shutdown-18","title":"Unplugged highlight","action":"A tiny hand pulls the robot's specular highlight out like a plug; the highlight retracts and the eye dims."},{"id":"shutdown-19","title":"Glass eyelash","action":"One long luminous eyelash grows across the eye, curls around its glow, and closes it like a delicate latch."},{"id":"shutdown-20","title":"Reflection tucks the robot in","action":"The reflection reaches up with a thin light line and smooths the robot's outer glow into a sleeping contour."},{"id":"shutdown-21","title":"Compressed hum","action":"A visible vibration ring contracts from the body into a single steady point, which fades into the inactive marker."},{"id":"shutdown-22","title":"Shell becomes a pebble","action":"Every protruding cosmetic feature retracts until the robot is a plain smooth pebble, with its tile and facing still marked."},{"id":"shutdown-23","title":"Slow-closing aperture","action":"The eye's aperture closes almost completely, opens for one last suspicious glance, then closes fully."},{"id":"shutdown-24","title":"Light folds its wings","action":"Two thin planes of internal light fold against one another and vanish into the center of the shell."},{"id":"shutdown-25","title":"Maintenance seam","action":"A narrow seam opens around the shell, a cleaning light passes once through it, and the seam closes into an inactive body."},{"id":"shutdown-26","title":"Sleep latch too high","action":"A tiny arm reaches unsuccessfully for a top latch, extends one extra joint, and finally switches the robot off." d once, and retracts ceremoniously."},{"id":"win-31","title":"Podium reflection only","action":"A grand podium forms entirely beneath the glass in the winner's reflection, while the actual robot stays on its legal tile."},{"id":"win-32","title":"Glass medal chooses a side","action":"A medal rotates edge-on several times, finds the robot's front, and rests neatly below the luminous eye."},{"id":"win-33","title":"Winner refuses to brag","action":"A giant crown grows overhead; the robot gently presses it down until it becomes a discreet little head ornament."},{"id":"win-34","title":"Victory aperture","action":"Concentric glass apertures open around the winner like a camera preparing a portrait, then stop with one warm framing ring."},{"id":"win-35","title":"Light pool standing ovation","action":"The winner's light pool rises as a thin vertical ring, tilts in a bow, and returns flat beneath its unchanged position."},{"id":"win-36","title":"Antenna conducts","action":"The winner's antenna flicks once; nearby decorative light lines rise and settle in response like a tiny orchestra."},{"id":"win-37","title":"Crown made of shadows","action":"The winner's surrounding shadows tilt upward into a crown silhouette while its colored shell remains softly lit."},{"id":"win-38","title":"A trophy too transparent","action":"The winner reaches for an almost invisible glass trophy, misses once, and finds it when a warm highlight outlines the edges."},{"id":"win-39","title":"Victory glass ribbon","action":"A rigid glass ribbon spirals once around the stationary winner, pauses impossibly unsupported, and resolves into a laurel."},{"id":"win-40","title":"Checkpoint lights take attendance","action":"One light for each earned checkpoint lines up above the winner, nods in sequence, and merges into the final victory mark."},{"id":"win-41","title":"Private little celebration","action":"Inside the translucent shell, a tiny mechanism waves a microscopic flag while the outer robot tries to remain
